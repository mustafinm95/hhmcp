[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hh-mcp"
version = "0.1.0"
description = "Local read-first MCP server for HeadHunter applicants"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "cryptography==50.0.1",
  "filelock==3.32.6",
  "httpx==0.28.1",
  "keyring==25.7.0",
  "mcp==2.2.0",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[project.scripts]
hh-mcp = "hh_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hh_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
